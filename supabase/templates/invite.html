<!doctype html>
<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #1c2b22; background: #f6f6f3; padding: 24px">
    <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border: 1px solid #e3e5df; border-radius: 8px; padding: 24px">
      <h2 style="margin: 0 0 12px; color: #1f4d36">You've been invited to Saunf</h2>
      <p>Your team uses Saunf to plan and track work. Accept the invitation to set your password and sign in.</p>
      <p style="margin: 24px 0">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/set-password"
           style="background: #1f4d36; color: #ffffff; padding: 10px 16px; border-radius: 6px; text-decoration: none">Accept invitation</a>
      </p>
      <p style="font-size: 12px; color: #6b7569">If you weren't expecting this invitation, you can ignore this email.</p>
    </div>
  </body>
</html>
