<!doctype html>
<html>
  <body
    style="
      font-family:
        -apple-system,
        Segoe UI,
        Roboto,
        sans-serif;
      color: #1a2238;
      background: #f4f8fb;
      padding: 24px;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #dfedf6;
        border-radius: 8px;
        padding: 24px;
      "
    >
      <h2 style="margin: 0 0 12px; color: #002f70">Reset your password</h2>
      <p>Someone requested a password reset for your Saunf account. The link expires in one hour.</p>
      <p style="margin: 24px 0">
        <a
          href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
          style="background: #002f70; color: #ffffff; padding: 10px 16px; border-radius: 6px; text-decoration: none"
          >Choose a new password</a
        >
      </p>
      <p style="font-size: 12px; color: #5f6b7f">
        If you didn't request this, you can ignore this email — your password won't change.
      </p>
    </div>
  </body>
</html>
